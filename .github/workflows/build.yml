name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: |
          flutter create --org com.tongtong --project-name tongtong build_app
          rm -rf build_app/lib build_app/pubspec.yaml
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Add Android permissions
        run: |
          python3 - << 'EOF'
          from pathlib import Path
          p = Path('build_app/android/app/src/main/AndroidManifest.xml')
          xml = p.read_text()
          perms = (
            '<uses-permission android:name="android.permission.INTERNET"/>'
            '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
            '<queries><intent><action android:name="android.speech.RecognitionService"/></intent>'
            '<intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>'
          )
          xml = xml.replace('<application', perms + '<application', 1)
          xml = xml.replace('android:label="tongtong"', 'android:label="통TONG"')
          p.write_text(xml)
          print('Manifest patched')
          EOF

      - name: Build APK
        run: |
          cd build_app
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongtong-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 통TONG v0.1.${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
